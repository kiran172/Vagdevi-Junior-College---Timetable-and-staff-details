services:
  - type: web
    name: vagdevi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vagdevi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://vagdevi-timetable.vercel.app   # update after Vercel deploy

databases:
  - name: vagdevi-db
    databaseName: vagdevi
    plan: free
